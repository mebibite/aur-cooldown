# aur-cooldown is a single executable script distributed via the AUR, not PyPI.
# This file exists for tooling only: the version single-source, pytest config,
# and the uv dev environment. It is never built or published as a package.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aur-cooldown"
description = "Delay AUR upgrades until they have aged, so malicious pushes are caught before they land"
readme = "README.md"
# Bounds the dev environment only, not the shipped script: nothing here is
# built or installed, so this is just the range uv resolves the test tooling
# for. Keeping it at the script's own 3.8 floor made uv fork the resolution
# onto Pythons nobody tests on and pin EOL pytest versions there (GHSA-6w46-
# j5rx-g56g). The script itself still targets 3.8+ — see its docstring.
requires-python = ">=3.10"
dynamic = ["version"]

# The one place the version is written: the VERSION line in the script itself
# (it has to be embedded there, since the script ships standalone). Everything
# else reads it from here.
[tool.hatch.version]
path = "aur-cooldown"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.uv]
package = false            # virtual project: manage the env, never build it

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::ResourceWarning"]
