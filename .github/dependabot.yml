# The tool itself has no dependency manifests (single-file Python, standard
# library only), so the only thing to keep updated is the GitHub Actions used
# in the workflows. Those are pinned by commit SHA; Dependabot bumps the SHA
# (with a comment showing the version) when a new release ships, and raises
# security-update PRs immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
